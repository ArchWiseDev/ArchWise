<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArchWise AI</title>
    <style>
        :root {
            --bg-primary: #212121;
            --bg-secondary: #171717;
            --bg-card: #2f2f2f;
            --text-primary: #ececec;
            --text-secondary: #b4b4b4;
            --accent: #10a37f;
            --code-bg: #0d0d0d;
            --border: #383838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10a37f, #0d8265);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .header-info h1 {
            font-size: 15px;
            font-weight: 600;
        }

        .header-info span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 100px 14px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.18s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .message-row.user .message-bubble {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message-row.assistant .message-bubble {
            background-color: transparent;
            color: var(--text-primary);
            padding-left: 0;
            padding-right: 0;
            width: 100%;
        }

        /* Markdown Rendering Styles */
        .markdown-body h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 14px 0 8px 0;
            color: #fff;
        }

        .markdown-body p {
            margin-bottom: 10px;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        .markdown-body strong {
            font-weight: 600;
            color: #fff;
        }

        .markdown-body em {
            font-style: italic;
            color: #d1d5db;
        }

        .markdown-body ul, .markdown-body ol {
            margin: 8px 0 12px 20px;
        }

        .markdown-body li {
            margin-bottom: 6px;
        }

        .markdown-body blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            color: var(--text-secondary);
            margin: 10px 0;
        }

        .markdown-body code {
            font-family: monospace;
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .markdown-body pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            border: none;
            display: block;
            line-height: 1.4;
        }

        .typing-cursor {
            display: inline-block;
            width: 7px;
            height: 15px;
            background-color: var(--text-primary);
            vertical-align: middle;
            margin-left: 3px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Input Controls */
        #input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, var(--bg-primary) 30%);
            padding: 12px 14px 20px 14px;
            display: flex;
            justify-content: center;
        }

        .input-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 768px;
            display: flex;
            align-items: flex-end;
            padding: 8px 12px;
            gap: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 150px;
            min-height: 24px;
            line-height: 22px;
            padding: 2px 4px;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        #send-btn {
            background-color: #fff;
            border: none;
            outline: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.15s ease;
        }

        #send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #send-btn svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="avatar-badge">A</div>
            <div class="header-info">
                <h1>ArchWise AI</h1>
                <span>3-Tier Architecture</span>
            </div>
        </div>
    </header>

    <div id="chat-container">
        <div class="message-row assistant">
            <div class="message-bubble markdown-body" id="welcome-msg">
                Hello! I am **ArchWise**, an independent local engine. How can I assist you today?
            </div>
        </div>
    </div>

    <div id="input-area">
        <div class="input-bar">
            <textarea id="prompt-input" rows="1" placeholder="Message ArchWise..."></textarea>
            <button id="send-btn" disabled>
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById("chat-container");
        const promptInput = document.getElementById("prompt-input");
        const sendBtn = document.getElementById("send-btn");

        // Dynamic Textarea Auto-expand
        promptInput.addEventListener("input", () => {
            promptInput.style.height = "auto";
            promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + "px";
            sendBtn.disabled = promptInput.value.trim() === "";
        });

        // Enter key to send (Shift+Enter for new line)
        promptInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) handleSend();
            }
        });

        sendBtn.addEventListener("click", handleSend);

        // Markdown to HTML Converter
        function renderMarkdown(text) {
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Code blocks: ```code```
            escaped = escaped.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

            // Inline code: `code`
            escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Headers: ### Header
            escaped = escaped.replace(/^###\s*(.*$)/gim, '<h3>$1</h3>');

            // Bold: **text**
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Italic: *text*
            escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Blockquotes: > quote
            escaped = escaped.replace(/^\>\s*(.*$)/gim, '<blockquote>$1</blockquote>');

            // Line breaks
            escaped = escaped.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');

            return '<p>' + escaped + '</p>';
        }

        // ChatGPT-Style Streaming Simulator
        async function streamTypeResponse(element, fullText) {
            // Split into fine tokens preserving formatting words and whitespace
            const tokens = fullText.match(/\S+|\s+/g) || [fullText];
            let accumulated = "";

            const cursor = document.createElement("span");
            cursor.className = "typing-cursor";
            element.appendChild(cursor);

            for (let i = 0; i < tokens.length; i++) {
                accumulated += tokens[i];
                element.innerHTML = renderMarkdown(accumulated);
                element.appendChild(cursor);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Dynamic pauses: slow down after punctuation, faster on regular tokens
                let delay = 14 + Math.random() * 12;
                if (/[\.\?\!\n]$/.test(tokens[i])) {
                    delay += 40;
                }
                await new Promise(res => setTimeout(res, delay));
            }

            cursor.remove();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSend() {
            const query = promptInput.value.trim();
            if (!query) return;

            // Render User Bubble
            const userRow = document.createElement("div");
            userRow.className = "message-row user";
            userRow.innerHTML = `<div class="message-bubble">${query.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
            chatContainer.appendChild(userRow);

            promptInput.value = "";
            promptInput.style.height = "auto";
            sendBtn.disabled = true;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Prepare Assistant Bubble
            const assistantRow = document.createElement("div");
            assistantRow.className = "message-row assistant";
            const bubble = document.createElement("div");
            bubble.className = "message-bubble markdown-body";
            assistantRow.appendChild(bubble);
            chatContainer.appendChild(assistantRow);

            // Fetch from local Termux Engine
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: jsonStringSafe({ message: query })
                });
                const data = await res.json();
                const reply = data.reply || "No response received.";
                await streamTypeResponse(bubble, reply);
            } catch (err) {
                bubble.innerHTML = `<p style="color: #ef4444;">Connection error: ensure server.py is running on port 8080.</p>`;
            }
        }

        function jsonStringSafe(obj) {
            return JSON.stringify(obj);
        }
    </script>
</body>
</html>
