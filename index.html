<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchWise Core Terminal</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: monospace; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .container { width: 100%; max-width: 640px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 20px; box-sizing: border-box; }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; text-align: center; }
    .chat-box { height: 320px; overflow-y: auto; background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 8px 12px; border-radius: 6px; line-height: 1.4; word-break: break-word; }
    .user { background: #0369a1; align-self: flex-end; color: #fff; max-width: 80%; }
    .bot { background: #1e293b; align-self: flex-start; border: 1px solid #475569; max-width: 80%; color: #38bdf8; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #475569; background: #020617; color: #fff; outline: none; }
    button { padding: 10px 18px; border: none; border-radius: 4px; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ArchWise Neural Interface</h1>
    <div class="chat-box" id="chat">
      <div class="msg bot">ArchWise Engine initialized. Enter a prompt to generate text.</div>
    </div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="Prompt ArchWise..." autocomplete="off">
      <button onclick="sendPrompt()">Send</button>
    </div>
  </div>
  <script>
    async function sendPrompt() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        chat.innerHTML += `<div class="msg bot">${data.response}</div>`;
      } catch (err) {
        chat.innerHTML += `<div class="msg bot" style="color:#ef4444;">Connection failed.</div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
