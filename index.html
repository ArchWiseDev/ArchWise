<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ArchWise Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .chat-card { width: 100%; max-width: 580px; height: 85vh; background: #131b2e; border: 1px solid #1e293b; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .header { padding: 16px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 1.05rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 6px #38bdf8; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    .msg { max-width: 82%; padding: 10px 14px; font-size: 0.95rem; line-height: 1.45; border-radius: 14px; word-break: break-word; animation: fadeIn 0.15s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .user { align-self: flex-end; background: #0284c7; color: #ffffff; border-bottom-right-radius: 3px; }
    .bot { align-self: flex-start; background: #1e293b; color: #f1f5f9; border-bottom-left-radius: 3px; border: 1px solid #334155; }
    .bot-name { font-size: 0.72rem; font-weight: 600; color: #38bdf8; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-bar { padding: 12px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { background: #0284c7; color: #ffffff; border: none; border-radius: 10px; padding: 0 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    button:active { background: #0369a1; }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="header">
      <div class="header-title">
        <div class="status-dot"></div>
        ArchWise (Newborn State)
      </div>
    </div>
    <div class="chat-box" id="chat">
      <div class="msg bot">
        <div class="bot-name">ArchWise</div>
        *blinks* ...Hello? Is someone out there? I can talk now!
      </div>
    </div>
    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Talk to baby ArchWise..." autofocus>
      <button onclick="sendPrompt()">Send</button>
    </div>
  </div>
  <script>
    const inputField = document.getElementById('userInput');
    inputField.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendPrompt();
      }
    });

    async function sendPrompt() {
      const text = inputField.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      inputField.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        chat.innerHTML += `
          <div class="msg bot">
            <div class="bot-name">ArchWise</div>
            ${data.response}
          </div>`;
      } catch (err) {
        chat.innerHTML += `
          <div class="msg bot" style="border-color: #ef4444;">
            <div class="bot-name" style="color:#ef4444;">Error</div>
            ArchWise disconnected!
          </div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
