<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ArchWise AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .chat-container { width: 100%; max-width: 680px; height: 90vh; background: #161b22; border: 1px solid #30363d; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
    .chat-header { padding: 16px 20px; background: #0d1117; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
    .ai-badge { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #1f6feb, #58a6ff); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 0.95rem; }
    .header-info h1 { font-size: 1.05rem; font-weight: 600; color: #f0f6fc; }
    .header-info p { font-size: 0.75rem; color: #8b949e; }
    .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .msg-row { display: flex; width: 100%; }
    .msg-row.user-row { justify-content: flex-end; }
    .msg-row.bot-row { justify-content: flex-start; }
    .msg { max-width: 85%; padding: 12px 16px; font-size: 0.92rem; line-height: 1.55; border-radius: 14px; word-break: break-word; }
    .user { background: #1f6feb; color: #ffffff; border-bottom-right-radius: 4px; }
    .bot { background: #21262d; color: #e6edf3; border-bottom-left-radius: 4px; border: 1px solid #30363d; }
    
    /* Markdown Styles */
    .msg pre { background: #0d1117; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid #30363d; font-size: 0.85rem; }
    .msg code { background: #0d1117; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; color: #79c0ff; }
    .msg pre code { padding: 0; background: transparent; }
    .msg strong { color: #f0f6fc; font-weight: 600; }
    .msg ul { margin-left: 20px; margin-top: 6px; margin-bottom: 6px; }
    .msg li { margin-bottom: 4px; }

    .chat-footer { padding: 14px 18px; background: #0d1117; border-top: 1px solid #30363d; display: flex; gap: 10px; }
    input[type="text"] { flex: 1; background: #21262d; border: 1px solid #30363d; border-radius: 10px; padding: 12px 16px; color: #f0f6fc; font-size: 0.92rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #58a6ff; }
    button { background: #1f6feb; color: #ffffff; border: none; border-radius: 10px; padding: 0 20px; font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #388bfd; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="ai-badge">A</div>
      <div class="header-info">
        <h1>ArchWise AI</h1>
        <p>Scratch-built language model</p>
      </div>
    </div>
    <div class="chat-body" id="chat">
      <div class="msg-row bot-row">
        <div class="msg bot">
          Hello! I am **ArchWise**, an AI assistant built from scratch. How can I help you today?
        </div>
      </div>
    </div>
    <div class="chat-footer">
      <input type="text" id="userInput" placeholder="Message ArchWise..." autofocus>
      <button onclick="sendPrompt()">Send</button>
    </div>
  </div>

  <script>
    function parseMarkdown(text) {
      let escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      escaped = escaped.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      escaped = escaped.replace(/(?:^|\n)-\s+(.*)/g, '<li>$1</li>');
      if (escaped.includes('<li>')) {
        escaped = escaped.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
      }
      escaped = escaped.replace(/\n/g, '<br>');
      return escaped;
    }

    const inputField = document.getElementById('userInput');
    inputField.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendPrompt();
      }
    });

    async function sendPrompt() {
      const text = inputField.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `
        <div class="msg-row user-row">
          <div class="msg user">${parseMarkdown(text)}</div>
        </div>`;
      inputField.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        chat.innerHTML += `
          <div class="msg-row bot-row">
            <div class="msg bot">${parseMarkdown(data.response)}</div>
          </div>`;
      } catch (err) {
        chat.innerHTML += `
          <div class="msg-row bot-row">
            <div class="msg bot" style="border-color: #f85149; color: #ff7b72;">
              Error: Could not reach ArchWise engine.
            </div>
          </div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
