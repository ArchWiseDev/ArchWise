<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ArchWise AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-main: #f8fafc;
    --bg-surface: #ffffff;
    --bg-surface-elevated: #f1f5f9;
    --border-subtle: #e2e8f0;
    --border-focus: #3b82f6;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-tertiary: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --user-msg-bg: #2563eb;
    --sidebar-w: 280px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg-main); color: var(--text-primary); display: flex; height: 100dvh; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg-surface);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease;
    z-index: 100;
    flex-shrink: 0;
  }

  .sidebar-top {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary);
    font-size: 1rem; cursor: pointer; transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--bg-surface-elevated); color: var(--text-primary); border-color: var(--border-focus); }

  .new-chat-pill {
    margin: 4px 14px 16px;
    padding: 12px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    transition: background 0.2s;
  }
  .new-chat-pill:hover { background: var(--accent-hover); }

  .recent-label {
    padding: 0 16px 8px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .chat-history-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-history-list::-webkit-scrollbar { width: 4px; }
  .chat-history-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

  .history-item {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.86rem;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s;
  }
  .history-item:hover, .history-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

  .sidebar-bottom {
    padding: 14px 16px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-surface-elevated);
  }
  .user-badge { display: flex; align-items: center; gap: 10px; cursor: pointer; overflow: hidden; }
  .user-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-size: 0.86rem; font-weight: 600; color: var(--text-primary); }
  .user-status { font-size: 0.72rem; color: var(--text-tertiary); }

  /* Workspace */
  #workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg-main);
    overflow: hidden;
  }

  .top-navbar {
    height: 60px;
    padding: 0 20px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
  .brand-title span { color: var(--accent); }

  /* Message Pane */
  #message-pane {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 130px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
  }
  #message-pane::-webkit-scrollbar { width: 6px; }
  #message-pane::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

  /* Hero Greeting */
  #greeting-hero {
    max-width: 780px;
    width: 100%;
    margin: auto auto 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    text-align: left;
    padding: 0 10px;
  }
  .hero-heading { font-size: 2.2rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; }
  .hero-heading span { color: var(--accent); }
  .hero-sub { font-size: 1.1rem; color: var(--text-secondary); }

  .hero-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .hero-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 130px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    transition: all 0.2s ease;
  }
  .hero-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    transform: translateY(-2px);
  }
  .hero-card-desc { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.4; font-weight: 500; }
  .hero-card-icon {
    align-self: flex-end;
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 0.85rem;
  }

  /* Chat Messages */
  .chat-row {
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 14px;
  }
  .chat-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 0.9rem;
  }
  .user-avatar-box { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .ai-avatar-box { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3); }

  .chat-body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .user-content {
    background: var(--user-msg-bg);
    padding: 12px 18px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    max-width: 85%;
    color: #fff;
    align-self: flex-end;
    line-height: 1.55;
    font-size: 0.93rem;
  }

  .ai-content {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    padding: 16px 20px;
    border-radius: 16px;
    border-top-left-radius: 4px;
    color: var(--text-primary);
    line-height: 1.65;
    font-size: 0.95rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    word-break: break-word;
  }
  .ai-content strong { color: var(--accent); font-weight: 600; }
  .ai-content code {
    background: var(--bg-surface-elevated);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.86rem;
    color: #0284c7;
  }
  .ai-content pre {
    background: #0f172a;
    border-radius: 10px;
    padding: 14px;
    margin: 12px 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.84rem;
    color: #e2e8f0;
  }
  .ai-content ul { margin-left: 20px; margin-top: 6px; }

  .chat-tools { display: flex; gap: 12px; margin-top: 4px; padding-left: 4px; }
  .tool-btn {
    background: transparent; border: none; color: var(--text-tertiary);
    font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color 0.15s;
  }
  .tool-btn:hover { color: var(--accent); }

  /* Input Capsule */
  #input-container {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 16px 20px;
    background: linear-gradient(180deg, rgba(248,250,252,0) 0%, rgba(248,250,252,0.9) 30%, var(--bg-main) 100%);
    pointer-events: none;
  }
  .input-capsule {
    pointer-events: auto;
    max-width: 780px;
    margin: 0 auto;
    background: var(--bg-surface);
    border: 1.5px solid var(--border-subtle);
    border-radius: 24px;
    padding: 10px 14px 10px 18px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    transition: all 0.2s;
  }
  .input-capsule:focus-within {
    border-color: var(--accent);
    box-shadow: 0 8px 28px rgba(37, 99, 235, 0.12);
  }

  #prompt-textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 0.95rem;
    outline: none;
    resize: none;
    min-height: 24px;
    max-height: 140px;
    line-height: 1.5;
    padding: 6px 0;
  }
  #prompt-textarea::placeholder { color: var(--text-tertiary); }

  .capsule-send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #fff;
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s, background 0.15s; flex-shrink: 0;
    margin-bottom: 2px;
  }
  .capsule-send-btn:disabled { opacity: 0.35; cursor: not-allowed; background: var(--text-tertiary); }
  .capsule-send-btn:not(:disabled):hover { background: var(--accent-hover); transform: scale(1.05); }

  @media (max-width: 768px) {
    #sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
    #sidebar.show { transform: translateX(0); box-shadow: 6px 0 30px rgba(0,0,0,0.15); }
    .hero-heading { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-top">
    <button class="icon-btn" id="sidebar-toggle-btn"><i class="fa-solid fa-bars"></i></button>
  </div>

  <div class="new-chat-pill" onclick="startFreshSession()">
    <i class="fa-solid fa-plus"></i>
    <span>New chat</span>
  </div>

  <span class="recent-label">Recent Conversations</span>
  <div class="chat-history-list" id="history-box"></div>

  <div class="sidebar-bottom">
    <div class="user-badge" onclick="authTrigger()">
      <img src="https://ui-avatars.com/api/?name=Guest&background=2563eb&color=fff" class="user-avatar" id="avatar-element">
      <div class="user-info">
        <span class="user-name" id="user-display">Guest User</span>
        <span class="user-status" id="user-status-sub">Click to sign in</span>
      </div>
    </div>
  </div>
</aside>

<!-- Workspace -->
<main id="workspace">
  <div class="top-navbar">
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="icon-btn" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
      <div class="brand-title">ArchWise <span>JS</span></div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <select id="persona-select" style="background:var(--bg-surface-elevated); color:var(--text-secondary); border:1px solid var(--border-subtle); border-radius:8px; padding:6px 10px; font-size:0.8rem; outline:none; cursor:pointer;">
        <option value="standard">🤖 Assistant</option>
        <option value="coder">💻 Coder</option>
        <option value="concise">⚡ Concise</option>
        <option value="pirate">🏴‍☠️ Pirate</option>
      </select>
    </div>
  </div>

  <div id="message-pane">
    <!-- Hero Greeting -->
    <div id="greeting-hero">
      <div>
        <h1 class="hero-heading">Hello, <span id="hero-name-greet">Explorer</span></h1>
        <p class="hero-sub">How can I assist you today?</p>
      </div>

      <div class="hero-cards-grid">
        <div class="hero-card" onclick="runStarter('Write a clean JavaScript function for Binary Search.')">
          <span class="hero-card-desc">JavaScript binary search algorithm implementation</span>
          <div class="hero-card-icon"><i class="fa-solid fa-code"></i></div>
        </div>
        <div class="hero-card" onclick="runStarter('Explain CSS Grid and Flexbox.')">
          <span class="hero-card-desc">CSS Grid vs Flexbox structural breakdown</span>
          <div class="hero-card-icon"><i class="fa-brands fa-css3-alt"></i></div>
        </div>
        <div class="hero-card" onclick="runStarter('Who is Nikola Tesla?')">
          <span class="hero-card-desc">Encyclopedic profile on Nikola Tesla</span>
          <div class="hero-card-icon"><i class="fa-solid fa-bolt"></i></div>
        </div>
        <div class="hero-card" onclick="runStarter('Tell me a fun technical fact.')">
          <span class="hero-card-desc">Interesting software and hardware trivia</span>
          <div class="hero-card-icon"><i class="fa-solid fa-lightbulb"></i></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Capsule Input -->
  <div id="input-container">
    <div class="input-capsule">
      <input type="file" id="file-upload-input" style="display:none;" accept=".txt,.py,.js,.json,.md,.html,.css">
      <button class="icon-btn" id="attach-btn" title="Attach Code/File" style="width:36px; height:36px; border:none;"><i class="fa-solid fa-paperclip"></i></button>
      <textarea id="prompt-textarea" rows="1" placeholder="Ask ArchWise..." autofocus></textarea>
      <button class="icon-btn" id="mic-action-btn" title="Voice Input" style="width:36px; height:36px; border:none;"><i class="fa-solid fa-microphone" id="mic-icon"></i></button>
      <button class="capsule-send-btn" id="send-action-btn" disabled><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>
</main>

<!-- Firebase Bundle -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, doc, setDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCx1vxQI8XBay6_kf4zdKb7A-agaHsCMks",
    authDomain: "archwise-web.firebaseapp.com",
    projectId: "archwise-web",
    storageBucket: "archwise-web.firebasestorage.app",
    messagingSenderId: "242932528466",
    appId: "1:242932528466:web:1d8d97ce2797dc24e1768b",
    measurementId: "G-6VRJZEMQY0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let activeSessionId = localStorage.getItem("archwise_sess_id") || "Chat_" + Date.now();

  getRedirectResult(auth).catch(console.error);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById("user-display").innerText = user.displayName || "User";
      document.getElementById("user-status-sub").innerText = "Cloud Synced";
      document.getElementById("hero-name-greet").innerText = user.displayName ? user.displayName.split(" ")[0] : "Explorer";
      document.getElementById("avatar-element").src = user.photoURL || document.getElementById("avatar-element").src;
      listenToSessions();
      subscribeMessages();
    } else {
      currentUser = null;
      document.getElementById("user-display").innerText = "Guest User";
      document.getElementById("user-status-sub").innerText = "Click to sign in";
      document.getElementById("hero-name-greet").innerText = "Explorer";
    }
  });

  window.authTrigger = () => {
    if (currentUser) {
      if (confirm("Sign out of ArchWise?")) signOut(auth);
    } else {
      signInWithRedirect(auth, provider);
    }
  };

  function subscribeMessages() {
    if (!currentUser) return;
    const q = query(collection(db, "users", currentUser.uid, "sessions", activeSessionId, "messages"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) return;
      document.getElementById("greeting-hero").style.display = "none";
      document.getElementById("message-pane").innerHTML = "";
      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        appendMessageBubble(d.text, d.isUser, false);
      });
    });
  }

  function listenToSessions() {
    if (!currentUser) return;
    const q = query(collection(db, "users", currentUser.uid, "sessions"), orderBy("updated", "desc"));
    onSnapshot(q, (snap) => {
      const box = document.getElementById("history-box");
      box.innerHTML = "";
      snap.forEach(d => {
        const item = document.createElement("div");
        item.className = `history-item ${d.id === activeSessionId ? "active" : ""}`;
        item.innerHTML = `<i class="fa-regular fa-message"></i><span>${d.data().title || d.id}</span>`;
        item.onclick = () => {
          activeSessionId = d.id;
          localStorage.setItem("archwise_sess_id", activeSessionId);
          listenToSessions();
          subscribeMessages();
          if (window.innerWidth <= 768) document.getElementById("sidebar").classList.remove("show");
        };
        box.appendChild(item);
      });
    });
  }

  window.saveMessage = async (text, isUser) => {
    if (!currentUser) return;
    try {
      await setDoc(doc(db, "users", currentUser.uid, "sessions", activeSessionId), {
        title: text.slice(0, 26),
        updated: serverTimestamp()
      }, { merge: true });

      await addDoc(collection(db, "users", currentUser.uid, "sessions", activeSessionId, "messages"), {
        text, isUser, timestamp: serverTimestamp()
      });
    } catch (e) {
      console.error(e);
    }
  };
</script>

<script>
  const pane = document.getElementById("message-pane");
  const hero = document.getElementById("greeting-hero");
  const textarea = document.getElementById("prompt-textarea");
  const sendBtn = document.getElementById("send-action-btn");
  const sidebar = document.getElementById("sidebar");

  function generateJavaScriptAIResponse(prompt, persona) {
    const p = prompt.toLowerCase();
    let reply = "";

    if (p.includes("binary search")) {
      reply = "Here is a clean implementation of Binary Search:\n```javascript\nfunction binarySearch(arr, target) {\n  let left = 0, right = arr.length - 1;\n  while (left <= right) {\n    let mid = Math.floor((left + right) / 2);\n    if (arr[mid] === target) return mid;\n    if (arr[mid] < target) left = mid + 1;\n    else right = mid - 1;\n  }\n  return -1;\n}\n```";
    } else if (p.includes("css grid") || p.includes("flexbox")) {
      reply = "**CSS Flexbox** is designed for one-dimensional layouts (a row or a column). **CSS Grid** is designed for two-dimensional layouts (rows and columns simultaneously).";
    } else if (p.includes("nikola tesla")) {
      reply = "**Nikola Tesla** was a Serbian-American inventor, electrical engineer, mechanical engineer, and futurist best known for his contributions to the design of the modern alternating current (AC) electricity supply system.";
    } else {
      reply = `I processed your request: **"${prompt}"**. As an autonomous client-side JavaScript engine running directly on GitHub Pages, I am fully operational and ready to assist you with development, research, and analysis!`;
    }

    if (persona === "coder") {
      reply = "```text\n# [Persona: Expert Coder Active]\n```\n\n" + reply;
    } else if (persona === "concise") {
      reply = reply.split("\n")[0];
    } else if (persona === "pirate") {
      reply = "Ahoy matey! " + reply.replaceAll("is", "be").replaceAll("are", "be") + " Arr!";
    }
    return reply;
  }

  function renderMarkdown(raw) {
    let out = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    out = out.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/^\* (.*$)/gim, '<li>$1</li>');
    return out.replace(/\n/g, '<br>');
  }

  function appendMessageBubble(text, isUser, animate = true) {
    if (hero.style.display !== "none") hero.style.display = "none";

    const row = document.createElement("div");
    row.className = "chat-row";

    if (isUser) {
      row.innerHTML = `
        <div class="chat-avatar user-avatar-box"><i class="fa-solid fa-user"></i></div>
        <div class="chat-body"><div class="user-content">${text.replace(/\n/g, '<br>')}</div></div>
      `;
      pane.appendChild(row);
    } else {
      row.innerHTML = `
        <div class="chat-avatar ai-avatar-box"><i class="fa-solid fa-atom"></i></div>
        <div class="chat-body">
          <div class="ai-content"></div>
          <div class="chat-tools">
            <button class="tool-btn" onclick="navigator.clipboard.writeText(\`${text.replace(/`/g, '\\`')}\`); this.innerHTML='<i class=\\'fa-solid fa-check\\'></i> Copied';"><i class="fa-regular fa-copy"></i> Copy</button>
            <button class="tool-btn" onclick="speakText(\`${text.replace(/`/g, '\\`').replace(/<[^>]*>/g, '')}\`)"><i class="fa-solid fa-volume-high"></i> Listen</button>
          </div>
        </div>
      `;
      pane.appendChild(row);
      const contentElem = row.querySelector(".ai-content");

      if (animate) {
        let i = 0;
        contentElem.innerHTML = "";
        const interval = setInterval(() => {
          contentElem.innerHTML = renderMarkdown(text.slice(0, i));
          i += 4;
          pane.scrollTop = pane.scrollHeight;
          if (i > text.length + 4) {
            clearInterval(interval);
            contentElem.innerHTML = renderMarkdown(text);
          }
        }, 10);
      } else {
        contentElem.innerHTML = renderMarkdown(text);
      }
    }
    pane.scrollTop = pane.scrollHeight;
  }

  let attachedContent = "";
  let attachedName = "";
  const attachBtn = document.getElementById("attach-btn");
  const fileInput = document.getElementById("file-upload-input");

  attachBtn.onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      attachedContent = event.target.result;
      attachedName = file.name;
      textarea.placeholder = `Attached: ${file.name}`;
      sendBtn.disabled = false;
    };
    reader.readAsText(file);
  };

  async function handleSend() {
    let text = textarea.value.trim();
    if (!text && !attachedContent) return;

    let fullPrompt = text;
    if (attachedContent) {
      fullPrompt = `[File: ${attachedName}]\n\`\`\`\n${attachedContent}\n\`\`\`\n\nPrompt: ${text}`;
      attachedContent = "";
      attachedName = "";
      textarea.placeholder = "Ask ArchWise...";
    }

    appendMessageBubble(fullPrompt, true);
    if (window.saveMessage) window.saveMessage(fullPrompt, true);
    textarea.value = "";
    textarea.style.height = "24px";
    sendBtn.disabled = true;

    const persona = document.getElementById("persona-select").value;

    setTimeout(() => {
      const response = generateJavaScriptAIResponse(fullPrompt, persona);
      appendMessageBubble(response, false, true);
      if (window.saveMessage) window.saveMessage(response, false);
      sendBtn.disabled = false;
      textarea.focus();
    }, 400);
  }

  function speakText(txt) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
    }
  }

  window.runStarter = (p) => { textarea.value = p; handleSend(); };
  window.startFreshSession = () => {
    localStorage.setItem("archwise_sess_id", "Chat_" + Date.now());
    location.reload();
  };

  const micBtn = document.getElementById("mic-action-btn");
  const micIcon = document.getElementById("mic-icon");
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => { micIcon.className = "fa-solid fa-microphone-slash"; micBtn.style.color = "var(--accent)"; };
    rec.onresult = (e) => { textarea.value = e.results[0][0].transcript; sendBtn.disabled = false; };
    rec.onend = () => { micIcon.className = "fa-solid fa-microphone"; micBtn.style.color = "inherit"; };
    micBtn.onclick = () => { try { rec.start(); } catch { rec.stop(); } };
  } else { micBtn.style.display = "none"; }

  textarea.addEventListener("input", function() {
    this.style.height = "24px";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
    sendBtn.disabled = !this.value.trim() && !attachedContent;
  });

  textarea.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (textarea.value.trim() || attachedContent) handleSend();
    }
  });

  sendBtn.onclick = handleSend;
  document.getElementById("sidebar-toggle-btn").onclick = () => sidebar.classList.toggle("show");
  document.getElementById("mobile-menu-btn").onclick = () => sidebar.classList.toggle("show");
</script>

</body>
</html>
